name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test (with race detector)
        run: go test -race -count=1 ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12.2
          install-mode: goinstall
          args: --timeout=5m

  frontend:
    # JS syntax + unit tests via Node's built-in runner — no npm, no deps, no
    # build step (frontend-rebuild Phase 0). The CSS/JS *contract* guards
    # (swapHTML seam, x-for division-of-labor, token-drift ratchets) are Go
    # tests in internal/docaudit and already run in the `test` job; this job
    # covers what Go can't: JS syntax and the pure-helper unit tests.
    name: Frontend (JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax-check our JS assets (vendored files excluded)
        run: |
          for f in internal/httpapi/templates/assets/*.js; do
            case "$(basename "$f")" in alpine.min.js) continue ;; esac
            echo "node --check $f"
            node --check "$f"
          done

      - name: JS unit tests (node:test)
        run: node --test "tests/js/*.test.cjs"
