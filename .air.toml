# Live-reload development config for github.com/somebox/cards.
# Install Air with:
#   go install github.com/air-verse/air@latest
# Then run:
#   air -c .air.toml
# or use the wrapper:
#   scripts/dev-server.sh

root = "."
tmp_dir = ".pi/tmp/air"

[build]
cmd = "go build -o .pi/tmp/air/cards ./cmd/cards"
bin = ".pi/tmp/air/cards"
args_bin = ["serve", "--workspace", "./.cards", "--port", "8787", "--seed"]
include_dir = ["cmd", "internal", ".cards/definitions"]
include_ext = ["go", "html", "css", "js", "json", "yaml", "yml"]
exclude_dir = [".git", ".pi", "docs", "media", "bin", "dist", "build", "vendor"]
exclude_regex = ["_test\\.go"]
delay = 500
stop_on_error = true
send_interrupt = true
kill_delay = "500ms"

[log]
time = true

[misc]
clean_on_exit = true
