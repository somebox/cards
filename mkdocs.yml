site_name: Cards
site_description: A local-first, single-binary coordination service for typed cards — one schema across API, CLI, MCP, and a web UI.
site_url: https://somebox.github.io/cards/
repo_url: https://github.com/somebox/cards
repo_name: somebox/cards
edit_uri: edit/main/docs/
copyright: MIT-licensed

docs_dir: docs

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.prune
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Internal process docs stay out of the published site (still visible on GitHub).
exclude_docs: |
  archive/
  README.md
  design/auth.md
  design/core-boundaries.md
  design/outbox-gonogo.md
  design/subscribers.md

# Built (reachable via links) but intentionally absent from the nav.
not_in_nav: |
  architecture/lifecycle-schema.md
  architecture/reload.md
  design/style-field.md
  design/themes.md

nav:
  - Home: index.md
  - Get started: get-started.md
  - Using Cards: using-cards.md
  - Guide:
      - Concepts: concepts/index.md
      - Philosophy: concepts/philosophy.md
      - Card definitions: reference/card-definitions.md
      - Workspace & boards: reference/workspace-and-boards.md
      - Card type examples: reference/card-type-examples.md
      - CLI usage: reference/cli.md
      - Users & auth: guides/users-and-auth.md
      - Walkthroughs:
          - Overview: examples/index.md
          - Shared setup: examples/setup.md
          - Software delivery: examples/software-delivery.md
          - Shop floor: examples/shop-floor.md
  - Agents:
      - MCP quickstart: agents/mcp.md
      - Agent instructions: agents/instructions.md
      - MCP design & ergonomics: extensions/mcp.md
  - Extend:
      - Extensions (hooks & services): extensions/index.md
      - Consuming events (SSE): events/integration.md
      - Events overview: events/index.md
      - Making themes: guides/themes.md
  - Reference:
      - Specification: spec/index.md
      - Data model: spec/data-model.md
      - API surface: spec/api-surface.md
      - Events & history: spec/events-history.md
      - Query DSL: spec/query-dsl.md
      - Card-type fields: spec/card-types.md
      - Architecture: architecture/index.md
      - Design system: architecture/design-system.md
      - Event contract: events/core.md
      - Event rollout history: events/rollout.md
      - Built vs proposed (audit): reference/implementation-status.md
      - Design notes: design-notes.md
      - Roadmap: roadmap.md
