# golangci-lint v2 config — pragmatic for a POC codebase, focused on real
# bugs, not style pedantry. Migrated from v1 via `golangci-lint migrate`;
# verified to enable the same five linters and to still catch unexcluded
# unchecked errors (errcheck) as the v1 config did — see commit history.
version: "2"
linters:
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
      exclude-functions:
        - (*database/sql.Tx).Rollback
        - (*github.com/somebox/cards/internal/sqlite.Store).Close
        - (net/http.ResponseWriter).Write
        - (*bufio.Writer).Write
        - (*bufio.Writer).WriteByte
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
